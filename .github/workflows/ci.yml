name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: pip install confluent-kafka pytest ruff
      - name: Lint
        run: ruff check src tests airflow/dags
      - name: Unit tests
        run: pytest -q
